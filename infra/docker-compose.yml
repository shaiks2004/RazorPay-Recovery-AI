services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recover
      POSTGRES_USER: recover
      POSTGRES_PASSWORD: recover
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recover -d recover"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - recover_postgres:/var/lib/postgresql/data

volumes:
  recover_postgres:

